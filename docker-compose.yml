services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  api:
    build: ./backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/instant_mechanic
      JWT_SECRET: change-this-in-production
      FRONTEND_URL: http://localhost:5173
    ports: ["5000:5000"]
    depends_on: [mongo]
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  mongo_data:
